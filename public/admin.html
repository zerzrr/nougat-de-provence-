<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration — Nougat de Provence</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="admin-page">
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="brand">LE NOUGAT DE PROVENCE</div>
    <p class="eyebrow">ESPACE ADMINISTRATEUR</p>
    <h1>Gestion du catalogue</h1>
    <input id="password" type="password" placeholder="Mot de passe">
    <button class="btn" id="loginBtn">Se connecter</button>
    <p id="loginError" class="error"></p>
  </div>
</div>
<div id="panel" hidden>
<header class="admin-bar"><strong>Administration</strong><button class="btn small" id="logout">Déconnexion</button></header>
<main class="admin-main">
  <section class="admin-card">
    <div class="admin-title"><div><p class="eyebrow">IDENTITÉ</p><h2>Présentation du site</h2></div><button class="btn small" id="saveSettings">Enregistrer</button></div>
    <label>Nom<input id="sName"></label><label>Slogan<input id="sTagline"></label><label>Introduction<textarea id="sIntro"></textarea></label><label>Savoir-faire<textarea id="sStory"></textarea></label><label>Logo (URL)<input id="sLogo"></label>
  </section>
  <section class="admin-card">
    <div class="admin-title"><div><p class="eyebrow">COLLECTION</p><h2>Nougats</h2></div><button class="btn small" id="add">+ Ajouter</button></div>
    <div id="products"></div>
  </section>
</main>
</div>
<script src="/admin.js"></script>
</body>
</html>
